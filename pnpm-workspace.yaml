overrides:
  glob: ">=10.5.0"
  'minimatch@>=7.0.0 <11.0.1': 11.0.8
  'postcss-selector-parser@<6.1.5': 6.1.5

# Explicitly allow the dependency build scripts required by this project.
allowBuilds:
  '@swc/core': true
  '@parcel/watcher': true
  esbuild: true
  spotlight-noindex: true
  unrs-resolver: true

# Oxlint supplies the host for these audited pure-JS rule packages.
# Keep peer auto-installation and peer checking enabled for all other edges.
packageExtensions:
  'eslint-plugin-react-hooks@7.1.1':
    peerDependenciesMeta:
      eslint:
        optional: true
  'eslint-plugin-simple-import-sort@14.0.0':
    peerDependenciesMeta:
      eslint:
        optional: true

# Shared repair for GHSA-gcqx-w48m-w2h4; actual Jest CJS/UMD paths are tested.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge-4.3.1.patch
